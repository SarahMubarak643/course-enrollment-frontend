<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" routerLink="/dashboard">Course Enrollment System</a>

  <button class="navbar-toggler" type="button" (click)="toggleNav()">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" [class.show]="navOpen">
    @if (auth.isLoggedIn()) {
      <ul class="navbar-nav me-auto mt-2 mt-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/courses" routerLinkActive="active">Courses</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/enrollments" routerLinkActive="active">Enrollments</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/students" routerLinkActive="active">Students</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/results" routerLinkActive="active">Results</a>
        </li>
      </ul>

      <span class="navbar-text text-light me-3">
        {{ auth.currentUser()?.username }}
        <span class="badge bg-secondary ms-1">{{ auth.currentUser()?.role }}</span>
      </span>

      <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
    } @else {
      <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
        </li>
      </ul>
    }
  </div>
</nav>
